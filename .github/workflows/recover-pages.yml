name: Recover stuck Phomer Pages deployment
on:
  push:
    paths:
      - .github/workflows/recover-pages.yml
permissions:
  contents: read
  pages: write
jobs:
  cancel-stuck-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/result -w "%{http_code}" -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/pages/deployments/2d7b55c8d22bb4916b2ce5292d738e2fc9b1e63b/cancel")
          echo "Cancel request returned HTTP $status"
          if [ "$status" != "204" ]; then cat /tmp/result; exit 1; fi
